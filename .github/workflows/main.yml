name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git unzip zip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Accept Android SDK Licenses & Install Build Tools
      run: |
        mkdir -p ~/.buildozer/android/platform/
        yes | python3 -c "
        import os
        from buildozer.targets.android import TargetAndroid
        " || true
        # SDK பதிவிறக்கம் செய்யப்பட்ட பிறகு உரிமங்களை ஏற்கிறது
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        # Build-tools உரிமப் பிரச்சனையைத் தவிர்க்க yes கட்டளையுடன் buildozer இயக்கப்படுகிறது
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: python-kivy-app
        path: bin/*.apk
        
